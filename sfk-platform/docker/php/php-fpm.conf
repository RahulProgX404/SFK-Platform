; Platform php-fpm settings
[global]
; A reload (SIGUSR2, sent by docker/php/dev-watch.sh after an edit) lets running requests finish first.
process_control_timeout = 20s

[www]
; Development (performance pass 2026-11-20, docs/performance.md): a fixed set of workers. With the image's default
; (pm = dynamic, 2 started, idle ones stopped) a click often landed on a new worker, which first had to look up every
; file again through the slow host file sharing and open a new TLS connection to the database (DB_PERSISTENT keeps one
; per worker): measured 0.5–1.3 s extra, and a page firing several requests at once waited for a free worker (5 at most).
pm = static
pm.max_children = 8
