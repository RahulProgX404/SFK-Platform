; Platform PHP settings
date.timezone = Asia/Tokyo
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 120

; Japanese text handling
mbstring.language = Japanese
default_charset = UTF-8

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; vendor alone has ~15,000 PHP files; the default (10,000) makes OPcache evict and recompile constantly.
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; Re-check changed files at most every 2 s instead of on every include: source is bind-mounted from the host,
; where each file check is slow (Docker Desktop on Windows). Edits still show up within 2 s.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Cache resolved paths longer (fewer filesystem lookups on the bind mount).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
