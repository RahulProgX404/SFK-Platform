; Platform PHP settings
date.timezone = Asia/Tokyo
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 120

; Japanese text handling
mbstring.language = Japanese
default_charset = UTF-8

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; vendor alone has ~15,000 PHP files; the default (10,000) makes OPcache evict and recompile constantly.
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; Never re-check files: the source is bind-mounted from the host, where each check is slow (Docker Desktop on
; Windows) and the checks cost most of each request. In development docker/php/dev-watch.sh reloads php-fpm after
; an edit instead; for any other use of this image, deploy = new container.
opcache.validate_timestamps = 0

; Cache resolved paths longer (fewer filesystem lookups on the bind mount).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
