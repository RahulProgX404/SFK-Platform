; PHP-FPM on Render: the workers see the service's environment variables (TRUSTED_PROXIES is read by bootstrap/app.php
; on every request), and a small pool fits the 512 MB of a free instance.
[www]
clear_env = no
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
