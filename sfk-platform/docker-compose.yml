# Local development environment.
#   docker compose up -d --build
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate --seed
# App:      http://localhost:8080        (ERP panel at /erp)
# Mail UI:  http://localhost:8025        (Mailpit)
# Postgres: localhost:5433  (user/pass/db from .env)

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: sfk-platform-php
  env_file: .env
  volumes:
    - ./:/var/www/html
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=300

  scheduler:
    <<: *app
    command: php artisan schedule:work

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sfk_platform}
      POSTGRES_USER: ${DB_USERNAME:-sfk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Tokyo
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sfk} -d ${DB_DATABASE:-sfk_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

  # HTML → PDF rendering (delivery notes, invoices, work instructions). Replaces PrintCreator.
  gotenberg:
    image: gotenberg/gotenberg:8

volumes:
  pgsql-data:
  redis-data:
