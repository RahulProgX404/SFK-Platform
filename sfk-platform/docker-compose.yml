# Local development environment.
#   docker compose up -d --build
#   docker compose exec app composer install
#   docker compose exec app php artisan migrate --seed
#   (after changing composer.lock: docker compose exec app composer install — vendor/ is a Docker volume)
# App:      http://localhost:8080        (ERP panel at /erp)
# Mail UI:  http://localhost:8025        (Mailpit)
# Postgres: localhost:5433  (user/pass/db from .env)

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: sfk-platform-php
  env_file: .env
  environment:
    # Compiled Blade views on the container's own filesystem: Filament renders hundreds of small views per
    # page, and reading each one through the host file sharing is slow. Recompiled after a container restart.
    VIEW_COMPILED_PATH: /tmp/views
    # Route cache and Filament's component cache, same reason; built and kept current by docker/php/dev-watch.sh.
    APP_ROUTES_CACHE: /tmp/cache/routes.php
    FILAMENT_CACHE_PATH: /tmp/cache/filament
  volumes:
    - ./:/var/www/html
    # vendor/ lives on a Docker volume (Linux filesystem) instead of the host bind mount: ~15,000 PHP files
    # are far too slow to read through the Windows/macOS file sharing. Fill it with
    # `docker compose exec app composer install` (again whenever composer.lock changes).
    # The host keeps its own vendor/ for the IDE, Pint and PHPStan.
    - vendor:/var/www/html/vendor
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    # php-fpm plus the watcher that reloads it after an edit (php.ini turns off OPcache's slow file checks) and keeps
    # the caches current. `docker compose logs app` shows what it rebuilt.
    command: sh docker/php/dev-start.sh

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=300

  scheduler:
    <<: *app
    command: php artisan schedule:work

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sfk_platform}
      POSTGRES_USER: ${DB_USERNAME:-sfk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Tokyo
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sfk} -d ${DB_DATABASE:-sfk_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

  # HTML → PDF rendering (delivery notes, invoices, work instructions). Replaces PrintCreator.
  gotenberg:
    image: gotenberg/gotenberg:8

volumes:
  pgsql-data:
  redis-data:
  vendor:
